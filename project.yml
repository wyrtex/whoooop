name: Pulsar

options:
  bundleIdPrefix: com.pulsar
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  Pulsar:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    settings:
      base:
        PRODUCT_NAME: Pulsar
        PRODUCT_BUNDLE_IDENTIFIER: com.pulsar.app
        CODE_SIGN_ENTITLEMENTS: iOS/Pulsar.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Pulsar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: Pulsar читает пульс, ВСР, сон, тренировки и другие показатели из Apple Health, чтобы рассчитать восстановление, нагрузку и качество сна.
        NSHealthUpdateUsageDescription: Pulsar сохраняет тренировки, записанные на Apple Watch, в Apple Health.
    dependencies:
      - target: PulsarWatch
    scheme: {}

  PulsarWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
    settings:
      base:
        PRODUCT_NAME: PulsarWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.pulsar.app.watchkitapp
        CODE_SIGN_ENTITLEMENTS: Watch/PulsarWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Pulsar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.pulsar.app
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Pulsar читает пульс, сон и тренировки, чтобы показывать восстановление и нагрузку прямо на часах.
        NSHealthUpdateUsageDescription: Pulsar записывает тренировки с часов в Apple Health.
