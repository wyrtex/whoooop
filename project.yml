name: Pulsar

options:
  bundleIdPrefix: com.pulsar
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  # Ключи Gemini для личной локальной сборки из .secrets/gemini_keys (файл не коммитится).
  preGenCommand: python3 scripts/generate_secrets.py

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  Pulsar:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    settings:
      base:
        PRODUCT_NAME: Pulsar
        PRODUCT_BUNDLE_IDENTIFIER: com.pulsar.app
        CODE_SIGN_ENTITLEMENTS: iOS/Pulsar.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Pulsar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: Pulsar читает пульс, ВСР, сон, тренировки и другие показатели из Apple Health, чтобы рассчитать восстановление, нагрузку и качество сна.
        NSHealthUpdateUsageDescription: Pulsar сохраняет тренировки, записанные на Apple Watch, в Apple Health.
        PulsarAppGroup: group.com.pulsar.app
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.pulsar.app.refresh]
    dependencies:
      - target: PulsarWatch
      - target: PulsarWidgets
    scheme: {}

  PulsarWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
    settings:
      base:
        PRODUCT_NAME: PulsarWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.pulsar.app.watchkitapp
        CODE_SIGN_ENTITLEMENTS: Watch/PulsarWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Pulsar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.pulsar.app
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Pulsar читает пульс, сон и тренировки, чтобы показывать восстановление и нагрузку прямо на часах.
        NSHealthUpdateUsageDescription: Pulsar записывает тренировки с часов в Apple Health.
        PulsarAppGroup: group.com.pulsar.app
    dependencies:
      - target: PulsarWatchWidgets

  # Виджеты iPhone: рабочий стол и экран блокировки.
  PulsarWidgets:
    type: app-extension
    platform: iOS
    sources: &widgetSources
      - path: Shared/Models
      - path: Shared/Engine
      - path: Shared/UI
      - path: Shared/Snapshot
      - path: Shared/Health
      - path: Widgets
    settings:
      base:
        PRODUCT_NAME: PulsarWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.pulsar.app.widgets
        CODE_SIGN_ENTITLEMENTS: Config/PulsarWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: Config/PulsarWidgets-Info.plist
      properties:
        CFBundleDisplayName: Pulsar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PulsarAppGroup: group.com.pulsar.app
        NSHealthShareUsageDescription: Виджеты Pulsar показывают восстановление, нагрузку и сон по данным Apple Watch из «Здоровья».
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Виджеты для циферблата Apple Watch (complications).
  PulsarWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: *widgetSources
    settings:
      base:
        PRODUCT_NAME: PulsarWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.pulsar.app.watchkitapp.widgets
        CODE_SIGN_ENTITLEMENTS: Config/PulsarWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    info:
      path: Config/PulsarWatchWidgets-Info.plist
      properties:
        CFBundleDisplayName: Pulsar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PulsarAppGroup: group.com.pulsar.app
        NSHealthShareUsageDescription: Виджеты Pulsar показывают восстановление, нагрузку и сон по данным Apple Watch из «Здоровья».
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
